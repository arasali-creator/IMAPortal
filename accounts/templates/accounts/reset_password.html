{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | IMA</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
 <style>

/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Outfit", Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #F36E42;
}

.container {
  display: flex;
  width: 100%;
  max-width: 1100px;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0px 6px 25px rgba(0,0,0,0.1);
  min-height: 600px;
}

/* Left Form */
.login-box {
  flex: 1;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.logo{
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-content: center;
    align-items: center;
}

.logo img {
  width: 170px;
  margin-bottom: 10px;
}

.logo h3 {
  font-weight: 600;
  color: #333;
  margin-bottom: 10px;
}
.logo p{
  color: #666;
  font-size: 13px;
  margin-bottom: 20px;
  text-align: center;
}

.success {
  color: #166534;
  background: rgba(34,197,94,.12);
  border: 1px solid rgba(34,197,94,.25);
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-weight: 600;
  font-size: 13px;
}

.input-group {
  position: relative;
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  margin-top: 5px;
}

.links {
  text-align: right;
  margin-bottom: 20px;
}

.links a {
  font-size: 13px;
  color: #333;
  text-decoration: none;
}

input:focus {
  border-color: #ff6600;
  box-shadow: 0 0 6px rgba(255, 102, 0, 0.35);
}

.divider {
  text-align: center;
  margin: 15px 0;
  position: relative;
  font-size: 14px;
  color: #aaa;
}

.divider span {
  background: white;
  padding: 0 10px;
  position: relative;
  z-index: 1;
}

.divider::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  border-top: 1px solid #ddd;
  z-index: 0;
}

/* Right Illustration */
.illustration {
  flex: 1;
  background: #f4f5f7;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.illustration img {
  max-width: 100%;
  height: auto;
}

/* Tablet */
@media (max-width: 1024px) {
  .container {
    max-width: 90%;
  }
  .login-box {
    padding: 30px;
  }
  .logo img {
    width: 120px;
  }
  .btn {
    font-size: 14px;
    padding: 10px;
  }
}

/* Mobile */
@media (max-width: 768px) {
  body {
    height: auto;
    padding: 20px;
  }
  .container {
    flex-direction: column;
    border-radius: 8px;
    min-height: auto;
  }
  .login-box {
    order: 1;
    padding: 20px;
    width: 100%;
  }
  .illustration {
    order: 2;
    padding: 20px;
  }
  .illustration img {
    width: 80%;
    max-width: 300px;
  }
  .btn {
    width: 100%;
    font-size: 14px;
  }
  .input-group input {
    font-size: 14px;
    padding: 10px 12px;
  }
  .logo img {
    width: 100px;
  }
}

/* Small Phones */
@media (max-width: 480px) {
  .logo img {
    width: 90px;
  }
  .logo h3 {
    font-size: 16px;
    margin-bottom: 10px;
  }
  .input-group input {
    font-size: 13px;
  }
  .btn {
    font-size: 13px;
    padding: 10px;
  }
  .links a {
    font-size: 12px;
  }
}

  </style>
</head>
<body>
  <div class="container">
    <!-- Left Side (Form) -->
    <div class="login-box">
      <div class="logo">
        <img src="{% static 'images/logo.png' %}" alt="Network Logo">
        <h3>Reset Password</h3>
        <p>Enter your CNIC or email to receive reset instructions.</p>
      </div>

      {% if sent %}
        <div class="success">If an account exists, we sent reset instructions.</div>
      {% endif %}

      <form method="post" class="login-form">
        {% csrf_token %}

        <div class="input-group">
          <label for="cnic_or_email">CNIC or Email</label>
          <input type="text" id="cnic_or_email" name="cnic_or_email" placeholder="Enter CNIC or Email" required>
        </div>

        <button type="submit" class="btn btn-primary full">Send Reset Link</button>

        <div class="divider">
          <span>OR</span>
        </div>

        <a href="{% url 'login' %}" class="btn btn-secondary full">Back to Login</a>
      </form>
    </div>

    <!-- Right Side (Illustration) -->
    <div class="illustration">
      <img src="{% static 'images/side.png' %}" alt="Reset Illustration">
    </div>
  </div>
</body>
</html>
