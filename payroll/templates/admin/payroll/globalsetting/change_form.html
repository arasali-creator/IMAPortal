{% extends "admin/change_form.html" %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f7f8fc;
    --card: rgba(255,255,255,.86);
    --text:#0f172a;
    --muted:#64748b;
    --line: rgba(15,23,42,.10);

    --primary:#ff6600;
    --dark:#181818;

    --shadow: 0 18px 40px rgba(2,6,23,.08);
    --shadow2: 0 12px 28px rgba(2,6,23,.06);
    --radius: 18px;
  }

  body{ font-family:"Outfit", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif !important; }
  #content{ background: var(--bg); }

  /* Hide default Django big header spacing a bit */
  #content > h1{ display:none; }

  .gs-form-wrap{
    max-width: 980px;
    margin: 0 auto;
  }

  .gs-hero{
    margin: 10px 0 16px 0;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow);
    overflow:hidden;
  }

  .gs-hero-head{
    padding: 18px 18px 14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;

    background:
      radial-gradient(900px 220px at 20% 10%, rgba(255,102,0,.14), transparent 60%),
      radial-gradient(900px 220px at 80% 0%, rgba(24,24,24,.14), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
    border-bottom: 1px solid var(--line);
  }

  .gs-title{
    margin:0;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: -.03em;
    color: var(--dark);
  }

  .gs-sub{
    margin: 8px 0 0 0;
    color: var(--muted);
    font-size: .98rem;
    max-width: 78ch;
  }

  .gs-badges{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding: 12px 18px 16px 18px;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid rgba(15,23,42,.12);
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(10px);
    font-weight: 900;
    font-size: .86rem;
    color: #0b1220;
  }
  .pill strong{ color: var(--primary); }

  /* Main form card */
  .gs-card{
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: rgba(255,255,255,.88);
    box-shadow: var(--shadow2);
    padding: 18px;
  }

  /* Make Django fieldsets look clean */
  .module.aligned, .module{
    border: none !important;
    background: transparent !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
  }

  .form-row{
    padding: 12px 0 !important;
    border-bottom: 1px solid rgba(15,23,42,.06);
  }
  .form-row:last-child{ border-bottom:none; }

  .form-row label{
    font-weight: 900 !important;
    color: #0b1220 !important;
  }

  .help, .helptext{
    color: var(--muted) !important;
    font-size: .9rem !important;
    margin-top: 6px !important;
  }

  /* Inputs */
  input[type="text"],
  input[type="number"],
  input[type="email"],
  textarea,
  select{
    border-radius: 14px !important;
    border: 1px solid rgba(15,23,42,.14) !important;
    background: rgba(255,255,255,.92) !important;
    padding: 12px 12px !important;
    box-shadow: none !important;
    font-size: 1rem !important;
  }

  input:focus, textarea:focus, select:focus{
    outline: none !important;
    border-color: rgba(255,102,0,.45) !important;
    box-shadow: 0 0 0 4px rgba(255,102,0,.12) !important;
  }

  /* Bottom buttons row */
  .submit-row{
    border: none !important;
    background: transparent !important;
    padding: 14px 0 0 0 !important;
    margin: 0 !important;
    display:flex !important;
    gap:10px !important;
    flex-wrap:wrap;
  }

  .submit-row input[type="submit"],
  .submit-row a.deletelink,
  .submit-row input[type="button"]{
    border-radius: 14px !important;
    padding: 10px 14px !important;
    font-weight: 900 !important;
    border: 1px solid rgba(15,23,42,.12) !important;
    background: rgba(255,255,255,.85) !important;
    cursor:pointer !important;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }

  .submit-row input[type="submit"].default{
    background: rgba(255,102,0,.12) !important;
    border-color: rgba(255,102,0,.35) !important;
    color: var(--dark) !important;
  }

  .submit-row input[type="submit"]:hover,
  .submit-row a.deletelink:hover{
    transform: translateY(-1px);
    box-shadow: 0 14px 24px rgba(2,6,23,.10);
    border-color: rgba(255,102,0,.30) !important;
  }

  /* Remove default wide left label column feel */
  .aligned label{
    width: auto !important;
  }
</style>

<div class="gs-form-wrap">
  <div class="gs-hero">
    <div class="gs-hero-head">
      <div>
        <h2 class="gs-title">Update USD→PKR Rate</h2>
        <p class="gs-sub">
          Manage the conversion rate used across salaries, payments, and expenses. The system always uses the latest entry.
        </p>
      </div>
    </div>

    <div class="gs-badges">
  
      <span class="pill">Tip: update rate carefully</span>
    </div>
  </div>

  <div class="gs-card">
    {{ block.super }}
  </div>
</div>

{% endblock %}
