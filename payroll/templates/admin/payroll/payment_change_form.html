{% extends "admin/change_form.html" %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f7f8fc;
    --card: rgba(255,255,255,.86);
    --text:#0f172a;
    --muted:#64748b;
    --line: rgba(15,23,42,.10);
    --primary:#ff6600;
    --dark:#181818;
    --shadow: 0 18px 40px rgba(2,6,23,.08);
    --shadow2: 0 12px 28px rgba(2,6,23,.06);
    --radius: 18px;
  }

  body{ font-family:"Outfit", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif !important; }
  #content{ background: var(--bg); }
  #content > h1{ display:none; }

  .ex-wrap{ max-width: 1050px; margin: 0 auto; }
  .ex-hero{
    margin: 10px 0 16px 0;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow);
    overflow:hidden;
  }

  .ex-hero-head{
    padding: 18px 18px 14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    background:
      radial-gradient(900px 220px at 20% 10%, rgba(255,102,0,.14), transparent 60%),
      radial-gradient(900px 220px at 80% 0%, rgba(24,24,24,.14), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
    border-bottom: 1px solid var(--line);
  }

  .ex-title{
    margin:0;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: -.03em;
    color: var(--dark);
  }
  .ex-sub{
    margin: 8px 0 0 0;
    color: var(--muted);
    font-size: .98rem;
    max-width: 80ch;
  }

  .ex-card{
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: rgba(255,255,255,.88);
    box-shadow: var(--shadow2);
    padding: 18px;
  }

  .module.aligned, .module{
    border: none !important;
    background: transparent !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
  }

  .module.aligned .aligned{
    grid-template-columns: 1fr !important;
  }

  .form-row{
    padding: 12px 0 !important;
    border-bottom: 1px solid rgba(15,23,42,.06);
  }
  .form-row:last-child{ border-bottom:none; }
  .form-row label{
    font-weight: 900 !important;
    color: #0b1220 !important;
  }

  input[type="text"],
  input[type="number"],
  input[type="email"],
  input[type="date"],
  textarea,
  select{
    border-radius: 14px !important;
    border: 1px solid rgba(15,23,42,.14) !important;
    background: rgba(255,255,255,.92) !important;
    padding: 12px 12px !important;
    box-shadow: none !important;
    font-size: 1rem !important;
  }

  input:focus, textarea:focus, select:focus{
    outline: none !important;
    border-color: rgba(255,102,0,.45) !important;
    box-shadow: 0 0 0 4px rgba(255,102,0,.12) !important;
  }

  .related-widget-wrapper{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .related-widget-wrapper > select,
  .related-widget-wrapper > input{
    flex: 1 1 auto;
  }

  .related-widget-wrapper-link{
    border-radius: 12px !important;
    border: 1px solid rgba(15,23,42,.12) !important;
    background: rgba(255,255,255,.85) !important;
    padding: 8px 10px !important;
    margin-left: 6px !important;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .related-widget-wrapper-link:hover{
    transform: translateY(-1px);
    box-shadow: 0 10px 18px rgba(2,6,23,.10);
    border-color: rgba(255,102,0,.30) !important;
  }

  .submit-row{
    position: sticky !important;
    bottom: 10px !important;
    z-index: 20 !important;
    border: 1px solid rgba(15,23,42,.10) !important;
    background: rgba(255,255,255,.72) !important;
    backdrop-filter: blur(12px) !important;
    border-radius: 16px !important;
    padding: 10px !important;
    margin: 16px 0 0 0 !important;
    box-shadow: 0 18px 30px rgba(2,6,23,.10) !important;
    display:flex !important;
    gap:10px !important;
    flex-wrap:wrap !important;
    align-items:center !important;
  }

  .submit-row input[type="submit"],
  .submit-row input[type="button"],
  .submit-row a{
    border-radius: 14px !important;
    padding: 10px 14px !important;
    font-weight: 900 !important;
    border: 1px solid rgba(15,23,42,.12) !important;
    background: rgba(255,255,255,.85) !important;
    cursor:pointer !important;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }

  .submit-row input[type="submit"].default{
    background: rgba(255,102,0,.14) !important;
    border-color: rgba(255,102,0,.35) !important;
    color: var(--dark) !important;
  }

  .submit-row input[type="submit"]:hover,
  .submit-row a:hover{
    transform: translateY(-1px);
    box-shadow: 0 14px 24px rgba(2,6,23,.10);
    border-color: rgba(255,102,0,.30) !important;
  }

  .submit-row a.deletelink{
    background: rgba(255, 0, 0, .08) !important;
    border-color: rgba(255, 0, 0, .20) !important;
    color: #991b1b !important;
  }

  .form-row.field-amount_usd{
    display: none !important;
  }

  .usd-preview{
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(255,102,0,.08);
    border: 1px solid rgba(255,102,0,.25);
    font-weight: 900;
    font-size: .9rem;
    color: #7c2d12;
  }
</style>

<div class="ex-wrap">
  <div class="ex-hero">
    <div class="ex-hero-head">
      <div>
        <h2 class="ex-title">Salary Payment</h2>
        <p class="ex-sub">
          Enter the payment in PKR; USD is calculated automatically.
        </p>
      </div>
    </div>
  </div>

  <div class="ex-card">
    {{ block.super }}
  </div>
</div>
<script>
  (function () {
    const rate = parseFloat("{{ pkr_rate|default:'0' }}");
    const input = document.querySelector('input[name="amount_pkr_input"]');
    if (!input) return;
    const row = input.closest(".form-row") || input.parentElement;
    const preview = document.createElement("div");
    preview.className = "usd-preview";
    row.appendChild(preview);

    function formatUSD(value) {
      return value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function update() {
      const raw = parseFloat(input.value);
      if (!rate || !raw) {
        preview.textContent = "USD: —";
        return;
      }
      const usd = raw / rate;
      preview.textContent = `USD: ${formatUSD(usd)}`;
    }

    input.addEventListener("input", update);
    update();

    const paidByInput = document.querySelector('select[name="paid_by"], input[name="paid_by"]');
    const paidByRow = paidByInput ? paidByInput.closest(".form-row") : null;
    if (paidByRow && row && paidByRow.parentElement === row.parentElement) {
      paidByRow.insertAdjacentElement("afterend", row);
    }
  })();
</script>
{% endblock %}
