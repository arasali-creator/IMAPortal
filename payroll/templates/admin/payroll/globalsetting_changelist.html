{% extends "admin/change_list.html" %}
{% load humanize %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f7f8fc;
    --card: rgba(255,255,255,.86);
    --text:#0f172a;
    --muted:#64748b;
    --line: rgba(15,23,42,.10);

    --primary:#ff6600;
    --dark:#181818;

    --shadow: 0 18px 40px rgba(2,6,23,.08);
    --shadow2: 0 12px 28px rgba(2,6,23,.06);
    --radius: 18px;
  }

  body{ font-family:"Outfit", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif !important; }
  #content{ background: var(--bg); }

  /* ===== Top header card (ONLY heading + buttons) ===== */
  .gs-wrap{
    margin-bottom: 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow);
    overflow:hidden;
  }

  .gs-head{
    padding: 18px 18px 14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;

    background:
      radial-gradient(900px 220px at 20% 10%, rgba(255,102,0,.14), transparent 60%),
      radial-gradient(900px 220px at 80% 0%, rgba(24,24,24,.14), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
    border-bottom: 1px solid var(--line);
  }

  .gs-title{
    margin:0;
    font-size: 1.45rem;
    font-weight: 900;
    letter-spacing: -.03em;
    color: var(--dark);
  }

  .gs-sub{
    margin: 8px 0 0 0;
    color: var(--muted);
    font-size: .98rem;
    max-width: 78ch;
  }

  .gs-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding: 14px 18px 16px 18px;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 9px 13px;
    border-radius: 999px;
    border: 1px solid rgba(15,23,42,.12);
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(10px);
    color: #0b1220;
    font-weight: 900;
    font-size: .87rem;
    text-decoration:none;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    cursor:pointer;
  }
  .chip:hover{
    transform: translateY(-1px);
    border-color: rgba(255,102,0,.30);
    box-shadow: 0 14px 26px rgba(255,102,0,.12);
  }
  .chip.primary{
    border-color: rgba(255,102,0,.28);
    background: rgba(255,102,0,.10);
    color: var(--dark);
  }
  .chip.dark{
    border-color: rgba(24,24,24,.18);
    background: rgba(24,24,24,.08);
    color: var(--dark);
  }

  /* ===== ONLY design the "image part": admin search + table ===== */

  /* Make the admin toolbar (search area) look like a glass card */
  #changelist > .grow > .flex.flex-col.gap-4.mb-4{
    border-radius: 16px !important;
    background: rgba(255,255,255,.78) !important;
    border: 1px solid rgba(15,23,42,.10) !important;
    box-shadow: var(--shadow2) !important;
    padding: 10px !important;
    backdrop-filter: blur(12px);
    overflow:hidden;
  }

  /* Search input container */
  #changelist-search .bg-white{
    border-radius: 16px !important;
    box-shadow: none !important;
    border: 1px solid rgba(15,23,42,.12) !important;
    background: rgba(255,255,255,.92) !important;
  }

  /* Result table wrapper card */
  #changelist-form{
    border-radius: 18px;
    border: 1px solid rgba(15,23,42,.10);
    background: rgba(255,255,255,.82);
    box-shadow: var(--shadow2);
    overflow:hidden;
  }

  /* Table styling */
  #result_list{
    border-collapse: separate !important;
    border-spacing: 0 !important;
  }

  #result_list thead th{
    background: rgba(15,23,42,.03) !important;
    border-bottom: 1px solid rgba(15,23,42,.10) !important;
    color:#0f172a !important;
    font-weight: 900 !important;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: .78rem !important;
  }

  #result_list tbody td{
    border-bottom: 1px solid rgba(15,23,42,.08) !important;
    font-size: .95rem;
  }

  /* Row hover */
  #result_list tbody tr:hover td{
    background: rgba(255,102,0,.05) !important;
    transition: .15s ease;
  }

  /* Checkbox column polish */
  #result_list .action-checkbox,
  #result_list input[type="checkbox"]{
    transform: scale(1.05);
    accent-color: var(--primary);
  }

  /* Make date "Updated at" icons look softer */
  #result_list .material-symbols-outlined{
    opacity:.75;
  }

  /* Responsive niceness */
  @media (max-width: 900px){
    .gs-head{ flex-direction:column; }
  }
</style>

<div class="gs-wrap">
  <div class="gs-head">
    <div>
      <h2 class="gs-title">Global Settings</h2>
      <p class="gs-sub">
        Manage the USD→PKR conversion rate used across salaries, payments, and expenses.
        The system always uses the latest entry.
      </p>
    </div>
  </div>

  <div class="gs-actions">
    <a class="chip primary" href="{% url 'admin:payroll_dashboard' %}">Payroll Dashboard</a>
    <a class="chip dark" href="{% url 'admin:payroll_company_summary' %}">Payroll Summary</a>
  </div>
</div>

{{ block.super }}
{% endblock %}
