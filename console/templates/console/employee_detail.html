{% extends "console/base.html" %}

{% block page_title %}{{ employee.full_name|default:employee.email }}{% endblock %}

{% block content %}
<div class="cn-card cn-card-pad" style="max-width:800px;">
  <form method="post" enctype="multipart/form-data" class="cn-django-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="cn-btn primary" type="submit"><i class="fa-solid fa-check"></i> Save Changes</button>
  </form>
</div>
{% endblock %}
