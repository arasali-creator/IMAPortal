{% extends "console/base.html" %}

{% block page_title %}{% if team %}Edit Team{% else %}New Team{% endif %}{% endblock %}

{% block content %}
<div class="cn-card cn-card-pad" style="max-width:640px;">
  <form method="post" class="cn-django-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="cn-btn primary" type="submit"><i class="fa-solid fa-check"></i> Save Team</button>
  </form>
</div>
{% endblock %}
