{% extends "admin/change_form.html" %}
{% load i18n static %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f7f8fc;
    --card: rgba(255,255,255,.92);
    --text:#0f172a;
    --muted:#64748b;
    --line: rgba(15,23,42,.10);
    --primary:#ff6600;
    --base:#181818;
    --shadow: 0 18px 40px rgba(2, 6, 23, .08);
    --shadow2: 0 10px 26px rgba(2, 6, 23, .06);
    --radius: 18px;
  }

  body{ font-family:"Outfit", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif !important; }
  #content{ background: var(--bg); }

  .payroll-form-wrap{ padding: 4px 0; }
  .payroll-form-main{
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow);
    padding: 12px;
  }

  .payroll-form-wrap fieldset{
    border: none;
    margin: 0 0 12px 0;
    padding: 0;
  }
  .payroll-form-wrap fieldset > h2,
  .payroll-form-wrap fieldset > legend{
    font-weight: 900 !important;
    letter-spacing: .06em;
    font-size: .72rem;
    color: var(--muted) !important;
    text-transform: uppercase !important;
    margin: 8px 0 10px 0 !important;
  }
  .payroll-form-wrap fieldset div.aligned{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }
  .payroll-form-wrap fieldset div.aligned > div.field-row.form-row{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: var(--shadow2);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .payroll-form-wrap fieldset div.aligned .field-line:hover{
    transform: translateY(-1px);
    border-color: rgba(255,102,0,.35);
  }
  .payroll-form-wrap fieldset div.aligned label{
    font-weight: 800 !important;
    color: var(--text) !important;
    margin-bottom: 6px;
  }
  .payroll-form-wrap fieldset div.aligned input[type="text"],
  .payroll-form-wrap fieldset div.aligned input[type="email"],
  .payroll-form-wrap fieldset div.aligned input[type="password"],
  .payroll-form-wrap fieldset div.aligned input[type="number"],
  .payroll-form-wrap fieldset div.aligned input[type="tel"],
  .payroll-form-wrap fieldset div.aligned input[type="url"],
  .payroll-form-wrap fieldset div.aligned input[type="date"],
  .payroll-form-wrap fieldset div.aligned input[type="datetime-local"],
  .payroll-form-wrap fieldset div.aligned select,
  .payroll-form-wrap fieldset div.aligned textarea{
    width: 100% !important;
    border: 1px solid var(--line) !important;
    border-radius: 10px !important;
    padding: 8px 10px !important;
    background: #fff !important;
  }
  .payroll-form-wrap fieldset div.aligned input:focus,
  .payroll-form-wrap fieldset div.aligned select:focus,
  .payroll-form-wrap fieldset div.aligned textarea:focus{
    outline: none !important;
    border-color: rgba(255,102,0,.55) !important;
    box-shadow: 0 0 0 4px rgba(255,102,0,.12) !important;
  }
  .payroll-form-wrap fieldset div.aligned > div.field-row.form-row:has(textarea),
  .payroll-form-wrap fieldset div.aligned > div.field-row.form-row:has(input[type="file"]){
    grid-column: 1 / -1;
  }

  @media(max-width:900px){
    .payroll-form-wrap fieldset div.aligned{ grid-template-columns: 1fr; }
  }
</style>

<div class="payroll-form-wrap">
  <div class="payroll-form-main">
    {{ block.super }}
  </div>
</div>
{% endblock %}
