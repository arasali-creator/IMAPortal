{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | IMA Admin</title>
  <style>

/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {

  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
 background: #F36E42;

}

.container {
  display: flex;
  width: 100%;
  max-width: 1100px;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0px 6px 25px rgba(0,0,0,0.1);
  min-height: 600px;
}

/* Left Login Form */
.login-box {
  flex: 1;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.logo{
    display: flex
;
    justify-content: center;
    flex-direction: column;
    align-content: center;
    align-items: center;
}

.logo img {
  width: 170px;
  margin-bottom: 10px;
}

.logo h3 {
  font-weight: 500;
  color: #333;
  margin-bottom: 30px;
}

.error {
  color: #e74c3c;
  margin-bottom: 10px;
}

.input-group {
  position: relative;
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 12px 45px 12px 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  margin-top: 5px;
}

.input-group .icon {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: #ff6600;
}

.links {
  text-align: right;
  margin-bottom: 20px;
}

.links a {
  font-size: 13px;
  color: #333;
  text-decoration: none;
}
input:focus {
  border-color: #667eea;
  box-shadow: 0 0 6px rgba(102, 126, 234, 0.4);
}

.btn {
  display: block;
  text-align: center;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  width: 100%;
  cursor: pointer;
  text-decoration: none;
   transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
  font-weight: 600;
}
.login-btn:hover {
  background: #5563d6;
  box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
}

.login-btn {
  background: #ff6600;
  color: white;
  border: none;
  margin-bottom: 20px;
}



.divider {
  text-align: center;
  margin: 15px 0;
  position: relative;
  font-size: 14px;
  color: #aaa;
}

.divider span {
  background: white;
  padding: 0 10px;
  position: relative;
  z-index: 1;
}

.divider::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  border-top: 1px solid #ddd;
  z-index: 0;
}

.signup-btn {
  border: 2px solid #ff6600;
  color: #ff6600;
  background: white;
}

.signup-btn:hover {
  background: #ff6600;
  color: white;
}

/* Right Illustration */
.illustration {
  flex: 1;
  background: #f4f5f7;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.illustration img {
  max-width: 100%;
  height: auto;
}

/* 🔹 RESPONSIVE DESIGN */

/* Tablet */
@media (max-width: 1024px) {
  .container {
    max-width: 90%;
  }

  .login-box {
    padding: 30px;
  }

  .logo img {
    width: 120px;
  }

  .btn {
    font-size: 14px;
    padding: 10px;
  }
}

/* Mobile */
@media (max-width: 768px) {
  body {
    height: auto;
    padding: 20px;
  }

  .container {
    flex-direction: column;
    border-radius: 8px;
    min-height: auto;
  }

  .login-box {
    order: 1;
    padding: 20px;
    width: 100%;
  }

  .illustration {
    order: 2;
    padding: 20px;
  }

  .illustration img {
    width: 80%;
    max-width: 300px;
  }

  .btn {
    width: 100%;
    font-size: 14px;
  }

  .input-group input {
    font-size: 14px;
    padding: 10px 40px 10px 12px;
  }

  .logo img {
    width: 100px;
  }
}

/* Small Phones */
@media (max-width: 480px) {
  .logo img {
    width: 90px;
  }

  .logo h3 {
    font-size: 16px;
    margin-bottom: 20px;
  }

  .input-group input {
    font-size: 13px;
  }

  .btn {
    font-size: 13px;
    padding: 10px;
  }

  .links a {
    font-size: 12px;
  }
}


  </style>
</head>
<body>
  <div class="container">
  <!-- Left Side (Form) -->
  <div class="login-box">
    <div class="logo">
      <img src="{% static 'images/logo.png' %}" alt="Network Logo">
      
    </div>

    {% if form.errors %}
      <p class="error">Invalid email or password</p>
    {% endif %}

    <form method="post" class="login-form">
      {% csrf_token %}
      
      <!-- Username -->
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="3120582345678" required>
        
      </div>

      <!-- Password with toggle -->
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        
      </div>

      

      <button type="submit" class="btn login-btn">Login </button>


    </form>
  </div>

  <!-- Right Side (Illustration) -->
  <div class="illustration">
    <img src="{% static 'images/side.png' %}" alt="Login Illustration">
  </div>
</div>



</body>
</html>
